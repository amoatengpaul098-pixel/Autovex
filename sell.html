<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell your vehicle | AUTOVEX</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">A</span>AUTOVEX<span class="brand-dot">.</span></a><button class="menu-toggle" aria-label="Open navigation">☰</button><nav class="main-nav"><a href="index.html">Home</a><a href="buy.html">Buy a car</a><a href="rent.html">Rent a car</a><a class="active" href="sell.html">Sell a car</a></nav><div class="header-actions"><a class="login-link" href="login.html">Log in</a><a class="btn btn-small" href="register.html">Create account</a></div></header><main class="page-main wrap narrow"><p class="eyebrow dark">SELL WITH AUTOVEX</p><h1 class="page-title">Put your car <span>in the spotlight.</span></h1><p class="page-intro">Sign in first, then submit your vehicle details. Your listing will be saved for review.</p><div id="sell-auth-message" class="notice hidden"></div><form id="sell-form" class="form-card"><div class="form-row"><label>Vehicle make<input name="make" required placeholder="e.g. Toyota"></label><label>Model<input name="model" required placeholder="e.g. Camry"></label></div><div class="form-row"><label>Year<input name="year" type="number" min="1950" max="2035" required></label><label>Vehicle type<select name="type" required><option value="">Choose type</option><option>SUV</option><option>Sedan</option><option>Sports</option><option>Electric</option><option>Truck</option></select></label></div><div class="form-row"><label>Price<input name="price" type="number" min="1" step="0.01" required placeholder="Price"></label><label>Currency<select name="currency"><option>USD</option><option>GHS</option><option>EUR</option><option>GBP</option><option>CAD</option></select></label></div><label>Country<input name="country" required placeholder="Country"></label><label>Vehicle description<textarea name="description" rows="4" placeholder="Mileage, condition, features and other details"></textarea></label><button class="btn full-width" type="submit">Submit vehicle listing ↗</button><p class="form-feedback" id="sell-feedback" aria-live="polite"></p></form></main><footer class="footer"><div class="wrap footer-inner"><a class="brand" href="index.html"><span class="brand-mark">A</span>AUTOVEX<span class="brand-dot">.</span></a><small>© 2026 AUTOVEX</small></div></footer><script src="js/app.js"></script></body></html>
