<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | AUTOVEX</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">A</span>AUTOVEX<span class="brand-dot">.</span></a><main class="auth-card"><p class="eyebrow dark">JOIN THE MARKETPLACE</p><h1>Create your <span>account.</span></h1><p>One account to explore, save and list vehicles.</p><form id="register-form"><label>Full name<input name="name" required minlength="2" autocomplete="name" placeholder="Your full name"></label><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Country<input name="country" required autocomplete="country-name" placeholder="Your country"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><label>Confirm password<input type="password" name="confirm_password" required minlength="8" autocomplete="new-password" placeholder="Enter password again"></label><button class="btn full-width" type="submit">Create account ↗</button><p class="form-feedback" id="register-feedback" aria-live="polite"></p></form><div class="auth-bottom">Already registered? <a href="login.html">Log in</a></div><a class="back-link" href="index.html">← Back to home</a></main><script src="js/app.js"></script></body></html>
